<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diarization Error Explorer</title>
<style>
  :root{
    --bg:#0f1116; --panel:#171a21; --panel2:#1d212a; --line:#2a2f3a;
    --fg:#e6e8ee; --dim:#9aa3b2; --accent:#5aa9e6;
    --miss:#3E7CB1; --fa:#4C9F70; --conf:#8B5FBF; --ovl:#D9A441;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:13px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;
         gap:14px;align-items:center;flex-wrap:wrap;background:var(--panel)}
  h1{font-size:14px;margin:0;font-weight:600;letter-spacing:.2px}
  .grid{display:grid;grid-template-columns:var(--leftw,32%) 5px 1fr;height:calc(100vh - 53px)}
  /* Drag handle for the clip list. Width is persisted, because the useful
     width depends on the task: wide to compare component columns, narrow to
     give the timeline room. */
  .gutter{cursor:col-resize;background:var(--line);transition:background .12s}
  .gutter:hover,.gutter.drag{background:#3d64ff}
  body.resizing{cursor:col-resize;user-select:none}
  .left{border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
  .right{display:flex;flex-direction:column;min-width:0;overflow:auto}
  .controls{padding:10px;border-bottom:1px solid var(--line);display:flex;
            flex-wrap:wrap;gap:8px;align-items:center;background:var(--panel2)}
  select,input,button{background:#0c0e13;color:var(--fg);border:1px solid var(--line);
                      border-radius:5px;padding:5px 8px;font-size:12px;font-family:inherit}
  button{cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.on{background:var(--accent);color:#08101a;border-color:var(--accent);font-weight:600}
  label{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.4px}
  .list{overflow:auto;flex:1}
  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
  th,td{padding:5px 7px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th{position:sticky;top:0;background:var(--panel2);cursor:pointer;user-select:none;
     font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.3px;z-index:2}
  th:hover{color:var(--fg)}
  th.sorted{color:var(--accent)}
  td:first-child,th:first-child{text-align:left}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#20242e}
  tbody tr.sel{background:#243044;box-shadow:inset 3px 0 0 var(--accent)}
  .pane{padding:12px 14px;border-bottom:1px solid var(--line)}
  .row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:10px;
        background:#0c0e13;border:1px solid var(--line);font-size:11px}
  .sw{width:9px;height:9px;border-radius:2px;display:inline-block}
  .chip.tog{cursor:pointer;user-select:none;transition:opacity .12s,border-color .12s}
  .chip.tog.off{opacity:.3}
  .chip.tog.solo{border-color:#e6e8ee;box-shadow:0 0 0 1px #e6e8ee inset}
  #scrub{-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;
         background:#2a2f3a;padding:0;border:0;flex:1;min-width:120px;cursor:pointer}
  #scrub::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;
         border-radius:50%;background:#e6e8ee;cursor:pointer}
  #scrub::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;
         background:#e6e8ee;cursor:pointer}
  .sheet-wrap{display:none;position:fixed;inset:0;background:#00000099;z-index:50;
              align-items:center;justify-content:center;padding:24px}
  .sheet-box{background:var(--panel);border:1px solid var(--line);border-radius:8px;
             max-width:min(1200px,95vw);max-height:88vh;overflow:auto;padding:16px 18px}
  .sheet th{color:#9aa3b2;font-weight:600;position:sticky;top:0;background:var(--panel)}
  .sheet td.mono{text-align:left}
  .sheet tr:hover td{background:#141821}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  canvas{display:block;width:100%;cursor:crosshair}
  .muted{color:var(--dim)}
  .big{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
  .kv{display:grid;grid-template-columns:auto auto;gap:2px 12px;font-size:12px}
  .kv span:nth-child(odd){color:var(--dim)}
  .warn{background:#3a2a12;border:1px solid #6b4d1d;color:#f0c987;
        padding:8px 10px;border-radius:6px;font-size:12px;margin:10px 14px}
  .err{background:#3a1720;border:1px solid #7a2b3d;color:#f3a9b8}
  #inspect{min-height:52px}
</style>
</head>
<body>
<header>
  <h1>Diarization Error Explorer</h1>
  <span class="muted mono" id="meta"></span>
  <span style="flex:1"></span>
  <label>model</label><select id="model"></select>
  <button id="worst">Worst failures</button>
  <button id="reset">Reset filters</button>
</header>

<div class="grid">
  <!-- ------------------------------------------------------------- left -->
  <div class="left">
    <div class="controls">
      <input id="search" placeholder="filter clip id…" style="flex:1;min-width:120px">
      <label>sort</label>
      <select id="sort">
        <option value="der">DER</option>
        <option value="jer">JER</option>
        <option value="error_sec">error seconds</option>
        <option value="miss_sec">miss</option>
        <option value="fa_sec">false alarm</option>
        <option value="confusion_sec">confusion</option>
        <option value="overlap_der">overlap DER</option>
        <option value="abs_count_err">|speaker-count error|</option>
        <option value="overlap_frac">overlap %</option>
        <option value="short_turn_frac">short-turn %</option>
        <option value="n_speakers_ref">speakers</option>
        <option value="duration">duration</option>
      </select>
      <div class="row" style="width:100%;gap:8px">
        <label>min DER</label><input id="minDer" type="number" step="0.05" min="0" max="1"
              style="width:66px" placeholder="0">
        <label>min overlap %</label><input id="minOvl" type="number" step="1" min="0" max="100"
              style="width:66px" placeholder="0">
        <label>speakers</label><input id="minSpk" type="number" min="1" style="width:52px"
              placeholder="any">
        <label>script</label><select id="script" style="max-width:130px"></select>
        <button id="byScript" title="pooled metrics grouped by writing system">by script</button>
      </div>
    </div>
    <div class="list"><table id="tbl">
      <thead><tr></tr></thead><tbody></tbody>
    </table></div>
  </div>
  <div class="gutter" id="gutter" title="drag to resize · double-click to reset"></div>

  <!-- ------------------------------------------------------------ right -->
  <div class="right">
    <div id="audiowarn"></div>
    <div class="pane">
      <div class="row">
        <button id="play">▶ Play</button>
        <button id="back5" title="back 5 s">« 5s</button>
        <button id="fwd5" title="forward 5 s">5s »</button>
        <input type="range" id="scrub" min="0" max="1000" value="0" step="1">
        <span class="mono" id="clock">0.00 / 0.00 s</span>
        <label>zoom</label>
        <button data-z="1">fit</button><button data-z="2">2×</button>
        <button data-z="5">5×</button><button data-z="10">10×</button>
        <button data-z="25">25×</button>
        <span class="muted">scroll to zoom · drag to pan · click to seek</span>
      </div>
      <audio id="audio" preload="metadata"></audio>
    </div>

    <div class="pane" id="summary"></div>

    <div class="pane">
      <div class="row" style="margin-bottom:8px">
        <span class="chip tog" data-type="MISS"><i class="sw"
          style="background:var(--miss)"></i>MISS <b class="ct"></b></span>
        <span class="chip tog" data-type="FA"><i class="sw"
          style="background:var(--fa)"></i>FALSE ALARM <b class="ct"></b></span>
        <span class="chip tog" data-type="CONFUSION"><i class="sw"
          style="background:var(--conf)"></i>CONFUSION <b class="ct"></b></span>
        <span class="chip tog" data-type="OVERLAP"><i class="sw"
          style="background:var(--ovl)"></i>OVERLAP <b class="ct"></b></span>
        <span class="muted" id="filterhint">click a tag to isolate · shift-click to combine ·
          click again to clear · <span title="Chip seconds are REGION seconds — the time spanned by regions carrying that error, and for a focused speaker the time that speaker is implicated in one. They deliberately do not partition DER: confusion implicates both speakers involved, so it counts on both. The authoritative component seconds are in the panel above.">why these ≠ DER seconds ⓘ</span></span>
      </div>
      <div class="row" style="margin-bottom:8px" id="spkbar"></div>
      <div id="focusnote"></div>
      <canvas id="tl"></canvas>
    </div>

    <div class="pane" id="inspect"><span class="muted">Click the timeline to inspect a moment.</span></div>
    <div class="pane" id="regions"></div>
  </div>
</div>

<div class="sheet-wrap" id="sheet">
  <div class="sheet-box">
    <div class="row" style="margin-bottom:10px">
      <b>Metrics by script</b><span style="flex:1"></span>
      <button id="sheetClose">close</button>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const fmt = (v,d=3) => (v===null||v===undefined||Number.isNaN(v)) ? "–" : Number(v).toFixed(d);
const COL = {MISS:"#3E7CB1", FA:"#4C9F70", CONFUSION:"#8B5FBF", OVERLAP:"#D9A441"};
// Distinct, colour-blind-safe-ish palette for speakers.
const SPK = ["#5aa9e6","#f2a65a","#7fd1ae","#e06c9f","#b39ddb","#a3d977","#f7d060","#8fd6e1"];

let INDEX=null, MODEL=null, CLIP=null, DATA=null;
let view={t0:0,t1:1}, dragging=null, playing=false;
/* TYPES: null = show every error type, else the set that is shown.
   FOCUS: null = every speaker, else one reference-speaker label. */
let TYPES=null, FOCUS=null;

/* ------------------------------------------------ region filtering model
   A region carries `ref` (reference speakers active) and `hyp` (predicted
   speakers active, already renamed through the optimal mapping), so both
   filters are derivable in the browser -- no re-export needed. */
const rtypes = r => r.overlap ? [...r.types, "OVERLAP"] : r.types;
const typeOK = r => !TYPES || rtypes(r).some(t => TYPES.has(t));

/* What one speaker's error in this region actually IS, and with whom.
   Returns null when S is not implicated: if S is active in both reference
   and hypothesis it was detected correctly here, and whatever error the
   region carries belongs to some other speaker. */
function focusRole(r, S){
  const inR = r.ref.includes(S), inH = r.hyp.includes(S);
  if(!inR && !inH) return null;
  const took = r.hyp.filter(x => !r.ref.includes(x));  // predicted, not truly speaking
  const lost = r.ref.filter(x => !r.hyp.includes(x));  // speaking, not predicted
  if(inR && !inH)
    return took.length ? {kind:"CONFUSION", partners:took,
                          label:`${S} → ${took.join(", ")}`,
                          note:"spoke, but the model credited"}
                       : {kind:"MISS", partners:[],
                          label:`${S} missed`, note:"spoke, model predicted silence"};
  if(!inR && inH)
    return lost.length ? {kind:"CONFUSION", partners:lost,
                          label:`${lost.join(", ")} → ${S}`,
                          note:"credited to this speaker, actually"}
                       : {kind:"FA", partners:[],
                          label:`${S} false alarm`, note:"predicted, reference is silent"};
  return null;
}
const focusOK = r => !FOCUS || focusRole(r, FOCUS) !== null;
const shown = r => typeOK(r) && focusOK(r);

/* ------------------------------------------------------------------ data */
async function boot(){
  INDEX = await (await fetch("data/clips.json")).json();
  MODEL = INDEX.models[0];
  $("#model").innerHTML = INDEX.models.map(m=>`<option>${m}</option>`).join("");
  $("#meta").textContent = `${INDEX.n_clips} clips · ${INDEX.models.join(" vs ")}`;

  // Scripts come from the export, not a hard-coded list: an export with only
  // Devanagari clips should not offer nine dead options.
  const scripts=[...new Set(INDEX.clips.map(c=>c.script||"unknown"))].sort();
  $("#script").innerHTML = `<option value="">all</option>` +
    scripts.map(x=>`<option value="${x}">${x}</option>`).join("");

  const v = INDEX.verification;
  if (v && v.mismatches && v.mismatches.length){
    $("#audiowarn").innerHTML =
      `<div class="warn err"><b>${v.mismatches.length} clip/model pairs failed region
       verification.</b> The regions drawn below do not reproduce the scored DER
       components; treat this view as unreliable until the export is fixed.</div>`;
  }
  buildHead(); render();
  if (INDEX.clips.length) select(sorted()[0].clip_id);
}

const COLS = [
  ["clip_id","clip"], ["der","DER"], ["jer","JER"], ["error_sec","err s"],
  ["miss_sec","miss"], ["fa_sec","FA"], ["confusion_sec","conf"],
  ["overlap_der","ovl DER"], ["spk","spk r/h"], ["overlap_frac","ovl%"],
  ["short_turn_frac","short%"], ["duration","dur s"],
];
function buildHead(){
  $("#tbl thead tr").innerHTML = COLS.map(([k,l])=>`<th data-k="${k}">${l}</th>`).join("");
  $("#tbl thead").onclick = e => {
    const k = e.target.dataset.k; if(!k || k==="clip_id" || k==="spk") return;
    $("#sort").value = k; render();
  };
}

const val = (c,k) => {
  const m = c.models[MODEL] || {};
  if (k==="abs_count_err") return Math.abs(m.speaker_count_error ?? 0);
  if (k in m) return m[k];
  return c[k];
};

function sorted(){
  const q=$("#search").value.trim().toLowerCase();
  const minDer=parseFloat($("#minDer").value)||0;
  const minOvl=(parseFloat($("#minOvl").value)||0)/100;
  const minSpk=parseInt($("#minSpk").value)||0;
  const scr=$("#script").value;
  const k=$("#sort").value;
  return INDEX.clips
    .filter(c => (!q || c.clip_id.toLowerCase().includes(q))
              && (val(c,"der")??0) >= minDer
              && c.overlap_frac >= minOvl
              && c.n_speakers_ref >= minSpk
              && (!scr || (c.script||"unknown") === scr))
    .sort((a,b) => (val(b,k)??-Infinity) - (val(a,k)??-Infinity));
}

function render(){
  const rows = sorted();
  $("#tbl thead tr").querySelectorAll("th").forEach(th =>
    th.classList.toggle("sorted", th.dataset.k===$("#sort").value));
  $("#tbl tbody").innerHTML = rows.map(c=>{
    const m=c.models[MODEL]||{};
    return `<tr data-id="${c.clip_id}" class="${c.clip_id===CLIP?'sel':''}">
      <td class="mono">${c.clip_id}</td>
      <td>${fmt(m.der,3)}</td><td>${fmt(m.jer,3)}</td>
      <td>${fmt(m.error_sec,1)}</td><td>${fmt(m.miss_sec,1)}</td>
      <td>${fmt(m.fa_sec,1)}</td><td>${fmt(m.confusion_sec,1)}</td>
      <td>${fmt(m.overlap_der,3)}</td>
      <td>${c.n_speakers_ref}/${m.n_speakers_hyp ?? "–"}</td>
      <td>${(c.overlap_frac*100).toFixed(1)}</td>
      <td>${(c.short_turn_frac*100).toFixed(0)}</td>
      <td>${fmt(c.duration,0)}</td></tr>`;
  }).join("");
  $("#tbl tbody").querySelectorAll("tr").forEach(tr =>
    tr.onclick = () => select(tr.dataset.id));
}

async function select(id){
  CLIP = id; render();
  DATA = await (await fetch(`data/${id}.json`)).json();
  view = {t0:DATA.uem[0], t1:DATA.uem[1]};
  const a=$("#audio"); a.src=`audio/${id}.wav`; playing=false; $("#play").textContent="▶ Play";
  a.onerror = () => $("#audiowarn").innerHTML =
    `<div class="warn">No audio for <span class="mono">${id}</span>.
     Everything except playback still works — see <span class="mono">audio/README.md</span>.</div>`;
  a.onloadeddata = () => $("#audiowarn").innerHTML = "";
  pendingSeek=null;
  summary(); clock(0); refresh();
}

/* --------------------------------------------------------------- summary */
function summary(){
  const b = DATA.models[MODEL], m = b.metrics||{}, t = b.totals||{};
  const idx = INDEX.clips.find(c=>c.clip_id===CLIP);
  const others = INDEX.models.filter(x=>x!==MODEL).map(x=>{
    const o=idx.models[x]||{}; const d=(m.der??0)-(o.der??0);
    return `<span class="chip">${x}: DER ${fmt(o.der,3)}
      <b style="color:${d>0?'#f3a9b8':'#a3d977'}">${d>0?'+':''}${fmt(d,3)}</b></span>`;
  }).join(" ");
  $("#summary").innerHTML = `
    <div class="row">
      <div><div class="muted">DER</div><div class="big">${fmt(m.der,4)}</div></div>
      <div><div class="muted">JER</div><div class="big">${fmt(m.jer,4)}</div></div>
      <div><div class="muted">overlap DER</div><div class="big">${fmt(m.overlap_der,4)}</div></div>
      <div class="kv" style="margin-left:14px">
        <span>miss</span><span class="mono">${fmt(t.miss_sec,2)} s</span>
        <span>false alarm</span><span class="mono">${fmt(t.fa_sec,2)} s</span>
        <span>confusion</span><span class="mono">${fmt(t.confusion_sec,2)} s</span>
      </div>
      <div class="kv">
        <span>speakers ref/hyp</span><span class="mono">${DATA.ref_speakers.length}/${b.hyp_speakers.length}</span>
        <span>overlap</span><span class="mono">${(idx.overlap_frac*100).toFixed(1)}%</span>
        <span>short turns</span><span class="mono">${(idx.short_turn_frac*100).toFixed(0)}%</span>
      </div>
      <div style="margin-left:auto">${others}</div>
    </div>
    <div class="row muted" style="margin-top:6px;font-size:11px">
      mapping: ${Object.entries(b.mapping).map(([h,r])=>
        `<span class="mono">${h}→${r}</span>`).join(" · ") || "none"}
    </div>`;
}

/* -------------------------------------------------------------- timeline */
const cv=$("#tl"), ctx=cv.getContext("2d");
// Reference speakers get the palette; a predicted speaker that maps to no
// reference speaker gets neutral grey. The old `(idx+len)%len` sent every
// unmapped speaker to the LAST palette colour, so a spurious speaker was drawn
// in a real speaker's colour -- which is exactly the collision the legend tells
// you to read as confusion.
const spkColor = s => { const i = DATA.ref_speakers.indexOf(s);
                        return i < 0 ? "#6b7280" : SPK[i % SPK.length]; };
const cssW = () => cv.clientWidth || 1;
const X = t => (t-view.t0)/(view.t1-view.t0)*cssW();
const T = x => view.t0 + x/cssW()*(view.t1-view.t0);

function draw(){
  if(!DATA) return;
  const dpr=devicePixelRatio||1, W=cv.clientWidth;
  const b0=DATA.models[MODEL];
  const nExtra=[...new Set(b0.hypothesis.map(t=>t.mapped))]
                 .filter(x=>!DATA.ref_speakers.includes(x)).length;
  const H=46 + (DATA.ref_speakers.length*2+nExtra)*24 + 22 + 30;
  cv.style.height=H+"px";
  cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const w=W, refS=DATA.ref_speakers, b=b0;
  // PRED rows are laid out in REFERENCE order, so row i of the lower block is
  // the same speaker as row i of the upper block and the two can be compared by
  // eye. A ref speaker the model never produced keeps its (empty) row rather
  // than collapsing the layout -- that gap IS the finding. Unmapped predicted
  // speakers are spurious by construction and go underneath, after a divider.
  const mappedSet=new Set(b.hypothesis.map(t=>t.mapped));
  const extra=[...mappedSet].filter(x=>!refS.includes(x)).sort();
  const hypS=[...refS, ...extra];
  ctx.clearRect(0,0,w,H);

  const ROW=20, GAP=4, top=46;
  const yRef=i=>top+i*(ROW+GAP);
  const hTop=yRef(refS.length)+22;
  const yHyp=i=>hTop+i*(ROW+GAP);

  // error strip
  ctx.fillStyle="#0c0e13"; ctx.fillRect(0,8,w,28);
  for(const r of b.regions){
    const x0=X(r.start), x1=X(r.end); if(x1<0||x0>w) continue;
    if(r.overlap){ ctx.fillStyle=COL.OVERLAP+"55"; ctx.fillRect(x0,8,Math.max(1,x1-x0),6); }
    if(!shown(r)) continue;
    // When a type is isolated, draw only that type's band -- otherwise an
    // isolated FA still renders the MISS stripe of a MISS+FA region.
    const ts = TYPES ? r.types.filter(t=>TYPES.has(t)) : r.types;
    if(!ts.length){
      // OVERLAP-only isolation: the region qualifies but carries no error band.
      if(TYPES && TYPES.has("OVERLAP") && r.overlap){
        ctx.fillStyle=COL.OVERLAP; ctx.fillRect(x0,14,Math.max(1,x1-x0),22); }
      continue;
    }
    const hgt=22/ts.length;
    ts.forEach((t,i)=>{ ctx.fillStyle=COL[t];
      ctx.fillRect(x0,14+i*hgt,Math.max(1,x1-x0),hgt); });
  }
  ctx.fillStyle="#9aa3b2"; ctx.font="10px ui-sans-serif";
  ctx.fillText("errors",4,6);

  // rows
  const label=(txt,y,c)=>{ ctx.fillStyle=c||"#9aa3b2"; ctx.font="10px ui-monospace";
                           ctx.fillText(txt,4,y-3); };
  refS.forEach((s,i)=>{ const y=yRef(i);
    ctx.fillStyle = (FOCUS===s) ? "#161b26" : "#0c0e13"; ctx.fillRect(0,y,w,ROW);
    label("GT "+s,y, (!FOCUS||FOCUS===s) ? spkColor(s) : "#4b515e"); });
  for(const t of DATA.reference){
    const i=refS.indexOf(t.speaker); if(i<0) continue;
    const x0=X(t.start),x1=X(t.end); if(x1<0||x0>w) continue;
    // Focus dims rather than hides: the speaker a segment was confused WITH is
    // the point of the view, so the other rows have to stay legible.
    ctx.globalAlpha = (!FOCUS || t.speaker===FOCUS) ? 1 : 0.16;
    ctx.fillStyle=spkColor(t.speaker);
    ctx.fillRect(x0,yRef(i)+5,Math.max(1,x1-x0),ROW-8);
  }
  ctx.globalAlpha=1;
  hypS.forEach((s,i)=>{ const y=yHyp(i);
    ctx.fillStyle="#0c0e13"; ctx.fillRect(0,y,w,ROW);
    if(FOCUS===s){ ctx.fillStyle="#161b26"; ctx.fillRect(0,y,w,ROW); }
    const absent=!mappedSet.has(s), spurious=!refS.includes(s);
    // A row with no counterpart is worth naming: "never found" is an entire
    // reference speaker missed, "spurious" is one the model invented.
    label("PRED "+s+(absent?"  (never found)":spurious?"  (spurious)":""),
          y, (absent||(FOCUS&&FOCUS!==s))?"#4b515e":spkColor(s)); });
  // Divider above the spurious block, so the mirrored region is unambiguous.
  if(extra.length){ const y=yHyp(refS.length)-GAP/2;
    ctx.strokeStyle="#2a2f3a"; ctx.setLineDash([3,3]); ctx.beginPath();
    ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); ctx.setLineDash([]); }
  for(const t of b.hypothesis){
    const i=hypS.indexOf(t.mapped); if(i<0) continue;
    const x0=X(t.start),x1=X(t.end); if(x1<0||x0>w) continue;
    ctx.globalAlpha = (!FOCUS || t.mapped===FOCUS) ? 1 : 0.16;
    ctx.fillStyle=spkColor(t.mapped);
    ctx.fillRect(x0,yHyp(i)+5,Math.max(1,x1-x0),ROW-8);
  }
  ctx.globalAlpha=1;

  // axis + playhead
  ctx.strokeStyle="#2a2f3a"; ctx.beginPath();
  const span=view.t1-view.t0, step=niceStep(span);
  for(let t=Math.ceil(view.t0/step)*step;t<view.t1;t+=step){
    const x=X(t); ctx.moveTo(x,40); ctx.lineTo(x,H-8);
    ctx.fillStyle="#68707e"; ctx.font="10px ui-monospace";
    ctx.fillText(t.toFixed(step<1?1:0)+"s",x+2,H-10);
  }
  ctx.stroke();
  const cur=$("#audio").currentTime;
  if(cur>=view.t0&&cur<=view.t1){ ctx.strokeStyle="#e6e8ee"; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(X(cur),8); ctx.lineTo(X(cur),H-8); ctx.stroke(); ctx.lineWidth=1; }
}
function niceStep(span){ const raw=span/10, p=Math.pow(10,Math.floor(Math.log10(raw)));
  return [1,2,5,10].map(m=>m*p).find(s=>s>=raw)||p*10; }

/* -------------------------------------------------------------- inspect */
function inspect(t){
  const b=DATA.models[MODEL];
  const ref=DATA.reference.filter(s=>s.start<=t&&t<s.end).map(s=>s.speaker);
  const hyp=b.hypothesis.filter(s=>s.start<=t&&t<s.end);
  const reg=b.regions.find(r=>r.start<=t&&t<r.end);
  const utt=DATA.utterances.find(u=>u.start<=t&&t<u.end);
  const tag=x=>`<span class="chip"><i class="sw" style="background:${spkColor(x)}"></i>${x}</span>`;
  $("#inspect").innerHTML=`
    <div class="row">
      <b class="mono">t = ${t.toFixed(2)} s</b>
      <div><span class="muted">GT:</span> ${ref.map(tag).join(" ")||"<span class=muted>silence</span>"}</div>
      <div><span class="muted">PRED:</span> ${hyp.map(h=>tag(h.mapped)+
          `<span class="muted mono" style="font-size:10px">(${h.speaker})</span>`).join(" ")
          ||"<span class=muted>silence</span>"}</div>
      <div>${reg? (reg.types.map(x=>
          `<span class="chip" style="border-color:${COL[x]}"><i class="sw"
            style="background:${COL[x]}"></i>${x}</span>`).join(" ")
          + (reg.overlap?`<span class="chip" style="border-color:${COL.OVERLAP}"><i class="sw"
            style="background:${COL.OVERLAP}"></i>OVERLAP</span>`:""))
        : '<span class="chip" style="border-color:#3d6">correct</span>'}</div>
    </div>
    ${utt?`<div class="muted" style="margin-top:6px">reference text:
      <span style="color:var(--fg)">${utt.text||"—"}</span></div>`:""}`;
}

function regionList(){
  const b=DATA.models[MODEL];
  const all=b.regions.filter(r=>rtypes(r).length && shown(r));
  const rs=[...all].sort((a,c)=>(c.end-c.start)-(a.end-a.start)).slice(0,40);
  const secs=all.reduce((a,r)=>a+(r.end-r.start),0);
  const what=[FOCUS?`<b style="color:${spkColor(FOCUS)}">${FOCUS}</b>`:null,
              TYPES?[...TYPES].join(" / "):null].filter(Boolean).join(" · ");
  $("#regions").innerHTML=`<div class="muted" style="margin-bottom:6px">
      ${all.length} region${all.length===1?"":"s"} · ${secs.toFixed(1)} s
      ${what?"— "+what:"— longest error regions"} · click to jump
      ${rs.length<all.length?`<span class="muted">(showing the ${rs.length} longest)</span>`:""}
      </div>` +
    rs.map(r=>{
      const ty = (TYPES ? rtypes(r).filter(t=>TYPES.has(t)) : r.types);
      const c  = COL[ty[0]] || COL.OVERLAP;
      // Under focus, name the counterpart rather than just the error class:
      // "Speaker_B → Speaker_A" is actionable, "CONFUSION" is not.
      const role = FOCUS ? focusRole(r, FOCUS) : null;
      return `<span class="chip" style="cursor:pointer;border-color:${c}"
        onclick="seek(${r.start})" title="${role?role.note:""}">
        <i class="sw" style="background:${c}"></i>
        <span class="mono">${r.start.toFixed(1)}–${r.end.toFixed(1)}s</span>
        ${role ? role.label : ty.join("+")}${r.overlap?" ⧉":""}
        <span class="muted">${(r.end-r.start).toFixed(2)}s</span></span>`;
    }).join(" ")
    || '<span class="muted">no regions match the current filter</span>';
}

/* ------------------------------------------------------------ filter bars */
function chipBars(){
  const b=DATA.models[MODEL];
  // Type counts respect the speaker focus, so isolating a speaker immediately
  // shows how their error splits across miss / FA / confusion.
  const secs={MISS:0,FA:0,CONFUSION:0,OVERLAP:0};
  for(const r of b.regions){
    if(!focusOK(r)) continue;
    for(const t of rtypes(r)) secs[t]+=r.end-r.start;
  }
  document.querySelectorAll("[data-type]").forEach(el=>{
    const t=el.dataset.type;
    el.querySelector(".ct").textContent = secs[t] ? secs[t].toFixed(1)+"s" : "0";
    el.classList.toggle("off", !!TYPES && !TYPES.has(t));
    el.classList.toggle("solo", !!TYPES && TYPES.has(t));
  });

  const refS=DATA.ref_speakers;
  const extra=[...new Set(b.hypothesis.map(t=>t.mapped))].filter(x=>!refS.includes(x));
  const per={};
  for(const s of [...refS,...extra]) per[s]={MISS:0,FA:0,CONFUSION:0};
  // Speaker labels are per clip. Selecting a clip that has no Speaker_D while
  // focused on Speaker_D would filter every region out and then dereference a
  // missing entry, so a stale focus is dropped here rather than guarded at
  // each of its four use sites.
  if(FOCUS && !(FOCUS in per)) FOCUS=null;
  for(const r of b.regions){
    if(!typeOK(r)) continue;
    for(const s of [...refS,...extra]){
      const role=focusRole(r,s); if(role) per[s][role.kind]+=r.end-r.start;
    }
  }
  $("#spkbar").innerHTML =
    `<span class="muted">speaker</span>` +
    [...refS,...extra].map(s=>{
      const p=per[s], tot=p.MISS+p.FA+p.CONFUSION;
      return `<span class="chip tog ${FOCUS&&FOCUS!==s?"off":""} ${FOCUS===s?"solo":""}"
        data-spk="${s}" title="miss ${p.MISS.toFixed(1)}s · FA ${p.FA.toFixed(1)}s · confusion ${p.CONFUSION.toFixed(1)}s">
        <i class="sw" style="background:${spkColor(s)}"></i>${s}
        <b class="muted">${tot.toFixed(0)}s</b></span>`;
    }).join(" ") +
    (FOCUS?` <span class="chip tog" data-spk="">clear</span>`:"");
  $("#spkbar").querySelectorAll("[data-spk]").forEach(el=>
    el.onclick=()=>{ const v=el.dataset.spk; FOCUS=(!v||FOCUS===v)?null:v; refresh(); });

  $("#focusnote").innerHTML = FOCUS ? focusNote(per[FOCUS]) : "";
}

/* Where a focused speaker's confusion actually went, in seconds. Direction is
   kept separate: "A's speech given to B" and "B's speech given to A" are
   different failures with different fixes. */
function focusNote(p){
  const b=DATA.models[MODEL], out={}, inn={};
  for(const r of b.regions){
    if(!typeOK(r)) continue;
    const role=focusRole(r,FOCUS);
    if(!role || role.kind!=="CONFUSION") continue;
    const d=r.end-r.start;
    const bucket = role.label.startsWith(FOCUS+" ") ? out : inn;
    for(const x of role.partners) bucket[x]=(bucket[x]||0)+d;
  }
  const fmtb=o=>Object.entries(o).sort((a,c)=>c[1]-a[1])
      .map(([k,v])=>`<span class="chip"><i class="sw" style="background:${spkColor(k)}"></i>${k} ${v.toFixed(1)}s</span>`)
      .join(" ") || '<span class="muted">none</span>';
  return `<div class="row" style="margin-bottom:8px;font-size:12px">
      <span class="muted">focused on</span>
      <span class="chip" style="border-color:${spkColor(FOCUS)}"><i class="sw"
        style="background:${spkColor(FOCUS)}"></i><b>${FOCUS}</b></span>
      <span class="muted">implicated in</span>
      <b>${p.MISS.toFixed(1)}s</b><span class="muted">miss</span>
      <b>${p.FA.toFixed(1)}s</b><span class="muted">false alarm</span>
      <b>${p.CONFUSION.toFixed(1)}s</b><span class="muted">confusion</span>
      <span class="muted" style="font-size:11px"
        title="Not a share of DER: a confusion implicates the speaker who spoke and the one credited, so the same second counts for both. pyannote also resolves regions where more speakers are lost than predicted by calling one of them missed rather than confused, and which one is arbitrary — so per-speaker miss runs slightly below the scored figure. Use these to find WHO and WITH WHOM, and the summary panel for HOW MUCH.">— implication, not a share of DER ⓘ</span>
    </div>
    <div class="row" style="margin-bottom:8px;font-size:12px">
      <span class="muted">their speech credited to</span> ${fmtb(out)}
      <span class="muted" style="margin-left:10px">their row actually spoken by</span> ${fmtb(inn)}
    </div>`;
}

/* One redraw path, so a filter change can never update the canvas but not the
   chips (or vice versa). */
function refresh(){ chipBars(); draw(); regionList(); }
let pendingSeek=null;
window.seek = t => {
  const a=$("#audio");
  t=Math.max(0, Math.min(t, DATA?DATA.uem[1]:t));
  // readyState 0 = HAVE_NOTHING: the element has no timeline yet and assigning
  // currentTime is dropped on the floor. Remember it and apply on metadata.
  if(a.readyState===0){ pendingSeek=t; a.load(); } else { a.currentTime=t; }
  clock(t); inspect(t); draw();
};
function clock(t){
  const a=$("#audio");
  const cur=(t!==undefined?t:a.currentTime)||0;
  const dur=isFinite(a.duration)?a.duration:(DATA?DATA.uem[1]:0);
  $("#clock").textContent=`${cur.toFixed(2)} / ${dur.toFixed(2)} s`;
  if(!scrubbing) $("#scrub").value = dur ? Math.round(cur/dur*1000) : 0;
}

/* ---------------------------------------------------------------- events */
$("#model").onchange = e => { MODEL=e.target.value; render();
  // Speaker labels are per model, so a focus on a spurious speaker of the old
  // model would silently filter everything out under the new one.
  if(DATA && FOCUS && !DATA.ref_speakers.includes(FOCUS)) FOCUS=null;
  if(DATA){ summary(); refresh(); } };
["#search","#minDer","#minOvl","#minSpk"].forEach(s=>$(s).oninput=render);
$("#sort").onchange = render;
$("#script").onchange = render;
$("#reset").onclick = () => { ["#search","#minDer","#minOvl","#minSpk"].forEach(s=>$(s).value="");
  $("#script").value=""; $("#sort").value="der"; render(); };

/* ------------------------------------------------------- resizable list */
(() => {
  const g=$("#gutter"), grid=document.querySelector(".grid");
  const set=px=>{ const w=Math.max(280,Math.min(px,innerWidth-420));
                  grid.style.setProperty("--leftw",w+"px");
                  localStorage.setItem("dee.leftw",w); draw(); };
  const saved=parseInt(localStorage.getItem("dee.leftw")||"",10);
  if(saved) grid.style.setProperty("--leftw",saved+"px");
  let on=false;
  g.onmousedown = e => { on=true; g.classList.add("drag");
                         document.body.classList.add("resizing"); e.preventDefault(); };
  addEventListener("mousemove", e => { if(on) set(e.clientX); });
  addEventListener("mouseup", () => { on=false; g.classList.remove("drag");
                                      document.body.classList.remove("resizing"); });
  // Reset to the default proportion rather than a pixel width, so it still
  // looks right on a different display.
  g.ondblclick = () => { grid.style.setProperty("--leftw","32%");
                         localStorage.removeItem("dee.leftw"); draw(); };
})();

/* ------------------------------------------------ metrics grouped by script
   Pooled, not averaged: DER is a ratio of durations, so a script's figure is
   sum(error) / sum(reference duration) across its clips. Averaging per-clip
   DERs would weight a 60 s clip like a 30 min one and is a different
   statistic from the corpus number reported elsewhere. */
function scriptTable(){
  const groups={};
  for(const c of INDEX.clips){
    const k=c.script||"unknown";
    (groups[k]=groups[k]||[]).push(c);
  }
  const cells=(rows,model)=>{
    let miss=0,fa=0,conf=0,tot=0,jerSum=0,jerN=0,spkOk=0,spkN=0,dur=0;
    for(const c of rows){
      const m=c.models[model]; if(!m) continue;
      // A clip with no exported denominator cannot join the pool; counting its
      // error without its total would inflate every script it appears in.
      if(m.total_sec==null||!(m.total_sec>0)) continue;
      miss+=m.miss_sec||0; fa+=m.fa_sec||0; conf+=m.confusion_sec||0;
      tot+=m.total_sec; dur+=c.duration||0;
      if(m.jer!=null){ jerSum+=m.jer; jerN++; }
      spkN++; if((m.speaker_count_error??1)===0) spkOk++;
    }
    if(!tot) return null;
    return {der:(miss+fa+conf)/tot, miss:miss/tot, fa:fa/tot, conf:conf/tot,
            jer:jerN?jerSum/jerN:null, spk:spkN?spkOk/spkN:null,
            n:spkN, hours:dur/3600};
  };
  const names=Object.keys(groups).sort();
  const head=`<tr><th>script</th><th>clips</th><th>hours</th>` +
    INDEX.models.map(m=>`<th colspan="6">${m}</th>`).join("") + `</tr>` +
    `<tr><th></th><th></th><th></th>` + INDEX.models.map(()=>
      `<th>DER</th><th>JER</th><th>miss</th><th>FA</th><th>conf</th><th>spk✓</th>`
    ).join("") + `</tr>`;
  const body=names.map(k=>{
    const per=INDEX.models.map(m=>cells(groups[k],m));
    const ref=per[0];
    return `<tr><td class="mono">${k}</td><td>${groups[k].length}</td>
      <td>${(groups[k].reduce((a,c)=>a+(c.duration||0),0)/3600).toFixed(2)}</td>` +
      per.map(v=>v?`<td>${fmt(v.der,3)}</td><td>${fmt(v.jer,3)}</td>
        <td>${fmt(v.miss,3)}</td><td>${fmt(v.fa,3)}</td><td>${fmt(v.conf,3)}</td>
        <td>${v.spk==null?"–":(v.spk*100).toFixed(0)+"%"}</td>`
        :`<td colspan="6" class="muted">–</td>`).join("") + `</tr>`;
  }).join("");
  // Corpus row, so a script can be read against the whole rather than in
  // isolation -- 0.42 means nothing until you know the corpus is 0.38.
  const all=INDEX.models.map(m=>cells(INDEX.clips,m));
  const total=`<tr style="border-top:2px solid var(--line);font-weight:600">
    <td>ALL</td><td>${INDEX.clips.length}</td>
    <td>${(INDEX.clips.reduce((a,c)=>a+(c.duration||0),0)/3600).toFixed(2)}</td>` +
    all.map(v=>v?`<td>${fmt(v.der,3)}</td><td>${fmt(v.jer,3)}</td>
      <td>${fmt(v.miss,3)}</td><td>${fmt(v.fa,3)}</td><td>${fmt(v.conf,3)}</td>
      <td>${v.spk==null?"–":(v.spk*100).toFixed(0)+"%"}</td>`
      :`<td colspan="6" class="muted">–</td>`).join("") + `</tr>`;
  return `<table class="sheet">${head}${body}${total}</table>`;
}

$("#byScript").onclick = () => {
  const el=$("#sheet");
  if(el.style.display==="flex"){ el.style.display="none"; return; }
  $("#sheetBody").innerHTML = scriptTable() +
    `<p class="muted" style="margin:10px 0 0">DER, miss, FA and confusion are pooled
     (Σ seconds ÷ Σ reference seconds), matching the corpus figure. JER is a mean of
     per-clip values because it has no shared denominator. spk✓ is the exact
     speaker-count match rate. Click a script row's name to filter the list.</p>`;
  el.style.display="flex";
  el.querySelectorAll("tbody tr, tr").forEach(tr=>{
    const k=tr.querySelector("td.mono"); if(!k) return;
    tr.style.cursor="pointer";
    tr.onclick=()=>{ $("#script").value=k.textContent.trim(); render();
                     el.style.display="none"; };
  });
};
$("#worst").onclick = () => { $("#sort").value="error_sec"; $("#minDer").value="";
  render(); const r=sorted()[0]; if(r) select(r.clip_id); };

let scrubbing=false;
$("#play").onclick = () => { const a=$("#audio");
  if(playing){a.pause();}
  else a.play().catch(e => $("#audiowarn").innerHTML =
    `<div class="warn">Playback blocked: ${e.message}. Serve the folder over HTTP
     (<span class="mono">python3 serve.py</span>) rather than opening the file directly.</div>`);
};
$("#audio").onplay  = ()=>{playing=true; $("#play").textContent="❚❚ Pause"; tick();};
$("#audio").onpause = ()=>{playing=false;$("#play").textContent="▶ Play"; clock();};
$("#audio").onloadedmetadata = ()=>{
  $("#audiowarn").innerHTML="";
  if(pendingSeek!==null){ $("#audio").currentTime=pendingSeek; pendingSeek=null; }
  clock(); draw();
};
// Fires on seek completion and during playback, so the clock and scrubber stay
// truthful even when tick() is not running.
$("#audio").onseeked = ()=>{ clock(); draw(); };
$("#audio").ontimeupdate = ()=>{ if(!playing) clock(); };
$("#scrub").oninput = e => {
  scrubbing=true;
  const a=$("#audio"), dur=isFinite(a.duration)?a.duration:(DATA?DATA.uem[1]:0);
  clock(e.target.value/1000*dur);
};
$("#scrub").onchange = e => {
  const a=$("#audio"), dur=isFinite(a.duration)?a.duration:(DATA?DATA.uem[1]:0);
  scrubbing=false; seek(e.target.value/1000*dur);
};
$("#back5").onclick = ()=>seek(($("#audio").currentTime||0)-5);
$("#fwd5").onclick  = ()=>seek(($("#audio").currentTime||0)+5);
function tick(){ if(!playing) return;
  const a=$("#audio");
  clock();
  if(a.currentTime>view.t1||a.currentTime<view.t0){ const s=view.t1-view.t0;
    view={t0:Math.max(0,a.currentTime-s*0.1),t1:Math.max(0,a.currentTime-s*0.1)+s}; }
  draw(); requestAnimationFrame(tick); }

/* ------------------------------------------------------- filter controls */
document.querySelectorAll("[data-type]").forEach(el => el.onclick = e => {
  const t=el.dataset.type;
  // Plain click isolates one type, which is the common case. Shift-click adds
  // or removes, for questions like "miss and confusion but not false alarm".
  if(e.shiftKey){
    TYPES = TYPES ? new Set(TYPES) : new Set(["MISS","FA","CONFUSION","OVERLAP"]);
    TYPES.has(t) ? TYPES.delete(t) : TYPES.add(t);
    if(TYPES.size===0 || TYPES.size===4) TYPES=null;
  } else {
    TYPES = (TYPES && TYPES.size===1 && TYPES.has(t)) ? null : new Set([t]);
  }
  refresh();
});

cv.onclick = e => { if(dragging&&dragging.moved) return;
  const r=cv.getBoundingClientRect();
  const x=e.clientX-r.left, y=e.clientY-r.top;
  const hit=rowAt(y);
  // The label gutter is a click target for focus; everywhere else seeks.
  if(hit && x<150){ FOCUS = (FOCUS===hit)?null:hit; refresh(); return; }
  seek(T(x)); };
// Mirrors draw()'s geometry. Kept adjacent to it so the two cannot drift.
function rowAt(y){
  if(!DATA) return null;
  const b=DATA.models[MODEL], refS=DATA.ref_speakers;
  const extra=[...new Set(b.hypothesis.map(t=>t.mapped))].filter(x=>!refS.includes(x));
  const hypS=[...refS,...extra], ROW=20, GAP=4, top=46;
  for(let i=0;i<refS.length;i++){ const t0=top+i*(ROW+GAP);
    if(y>=t0&&y<t0+ROW) return refS[i]; }
  const hTop=top+refS.length*(ROW+GAP)+22;
  for(let i=0;i<hypS.length;i++){ const t0=hTop+i*(ROW+GAP);
    if(y>=t0&&y<t0+ROW) return hypS[i]; }
  return null;
}
cv.onwheel = e => { e.preventDefault();
  const r=cv.getBoundingClientRect();
  const t=T((e.clientX-r.left));
  const f=e.deltaY>0?1.25:0.8, s=(view.t1-view.t0)*f;
  const lim=DATA.uem[1]-DATA.uem[0];
  const w=Math.min(s,lim), frac=(t-view.t0)/(view.t1-view.t0);
  view={t0:Math.max(0,t-w*frac), t1:Math.min(DATA.uem[1],Math.max(0,t-w*frac)+w)};
  draw(); };
cv.onmousedown = e => dragging={x:e.clientX,t0:view.t0,t1:view.t1,moved:false};
addEventListener("mousemove", e => { if(!dragging) return;
  const r=cv.getBoundingClientRect();
  const dt=-(e.clientX-dragging.x)/r.width*(dragging.t1-dragging.t0);
  if(Math.abs(e.clientX-dragging.x)>3) dragging.moved=true;
  view={t0:dragging.t0+dt,t1:dragging.t1+dt}; draw(); });
addEventListener("mouseup", ()=>setTimeout(()=>dragging=null,0));
document.querySelectorAll("[data-z]").forEach(b => b.onclick = () => {
  const lim=DATA.uem[1]-DATA.uem[0], z=+b.dataset.z, c=$("#audio").currentTime||view.t0;
  const s=lim/z; view={t0:Math.max(0,c-s/2),t1:Math.min(DATA.uem[1],Math.max(0,c-s/2)+s)}; draw(); });
addEventListener("resize", draw);
$("#sheetClose").onclick = () => $("#sheet").style.display="none";
$("#sheet").onclick = e => { if(e.target.id==="sheet") $("#sheet").style.display="none"; };
addEventListener("keydown", e => {
  if(e.code==="Escape"){ $("#sheet").style.display="none"; return; }
  if(e.code==="Space"){e.preventDefault();$("#play").click();} });
boot();
</script>
